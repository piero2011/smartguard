# /etc/systemd/system/smartguard.service.d/nftables.conf
# SOLO si ENABLE_NFTABLES=true. Da al proceso (usuario smartguard, no root) la capacidad mínima
# para añadir/quitar elementos de los sets de "table inet smartguard" ejecutando /usr/sbin/nft
# con execFile (sin shell) y argumentos validados. Nunca root, nunca sudo.
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN
AmbientCapabilities=CAP_NET_ADMIN
ReadOnlyPaths=-/usr/sbin/nft
