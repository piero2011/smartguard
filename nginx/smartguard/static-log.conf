# =============================================================================
# /etc/nginx/smartguard/static-log.conf — contexto LOCATION (location de estáticos)
# Sustituye a "access_log off;" en la location de estáticos: sigue sin registrar los 200/304
# (mismo coste que hoy), pero registra los 4xx para detectar enumeración de plugins/themes
# (readme.txt, .css inexistentes…).
# =============================================================================
access_log /var/log/nginx/smartguard/access.json smartguard_json buffer=64k flush=2s if=$sg_log_static_err;
