# =============================================================================
# /etc/nginx/smartguard/auth-php.conf — contexto LOCATION. Incluir en TODA location con fastcgi_pass.
# =============================================================================
# Se ejecuta en la fase access: después de los rewrites y ANTES de try_files/fastcgi_pass,
# así que un .php inexistente también se puntúa (y luego try_files devuelve 404 sin tocar PHP).
# Las redirecciones internas (try_files ... /index.php) vuelven a pasar por aquí.
auth_request /_smartguard/decision;
