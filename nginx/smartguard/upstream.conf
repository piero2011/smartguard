# =============================================================================
# /etc/nginx/smartguard/upstream.conf — contexto http
# =============================================================================
# SmartGuard escucha SOLO en 127.0.0.1:3100 (nunca expuesto).
# keepalive: reutiliza conexiones → sin handshake TCP por decisión.
upstream smartguard_backend {
    server 127.0.0.1:3100;
    keepalive 16;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}
