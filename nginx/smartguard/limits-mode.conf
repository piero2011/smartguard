# =============================================================================
# /etc/nginx/smartguard/limits-mode.conf — GENERADO por `smartguard audit on|off` (contexto server)
# =============================================================================
# AUDIT: los limit_req/limit_conn del server NO rechazan; solo registran
#        $limit_req_status = REJECTED_DRY_RUN en el log JSON ("lr").
# OJO: afecta a TODAS las zonas del server, incluida tu zona "botzone" (que con 600r/m y burst 600
#      prácticamente nunca actuaba).
limit_req_dry_run on;
limit_conn_dry_run on;
