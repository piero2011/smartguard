# =============================================================================
# /etc/nginx/smartguard/maps.conf — contexto http
# Todos los nombres con prefijo sg_ para no colisionar con los maps existentes de tus vhosts
# ($is_blocked_bot, $should_block, $limit_key, $is_acme... siguen siendo tuyos).
#
# Nota: las variables map se calculan UNA vez por petición (la primera vez que se usan, a nivel
# server, con la URI ORIGINAL) y se cachean, también a través de try_files → /index.php.
# =============================================================================

# ---------------------------------------------------------------------------
# Clasificación de la petición
# ---------------------------------------------------------------------------

# Estáticos: nunca van a SmartGuard ni cuentan en zonas dinámicas.
map $uri $sg_is_static {
    default 0;
    "~*\.(?:png|jpe?g|gif|svg|webp|avif|ico|bmp|ttf|otf|eot|woff2?|css|js|mjs|map|mp4|webm|mp3|ogg|wav|pdf|txt|json)$" 1;
}

# Endpoint WordPress (admite prefijo de subsitio multisite: /site1/wp-login.php)
map $uri $sg_endpoint {
    default "";
    "~*(?:^|/)wp-login\.php$"                   login;
    "~*(?:^|/)xmlrpc\.php$"                     xmlrpc;
    "~*/wp-admin/admin-ajax\.php$"              ajax;
    "~*(?:^|/)wp-cron\.php$"                    cron;
    "~*^/(?:[_0-9a-zA-Z-]+/)?wp-json(?:/|$)"    rest;
}

# Endpoints indicados por query string (WooCommerce AJAX y REST por ?rest_route=)
map $args $sg_arg_class {
    default "";
    "~(?:^|&)wc-ajax="      wcajax;
    "~(?:^|&)rest_route="   rest;
}

# ---------------------------------------------------------------------------
# Claves de rate limit. Vacía = no cuenta. IPs de confianza ($sg_trusted) nunca cuentan.
# $binary_remote_addr = IP REAL del visitante (tras realip de Cloudflare).
# ---------------------------------------------------------------------------
map $sg_trusted $sg_ip_key {
    1       "";
    default $binary_remote_addr;
}

map $sg_is_static $sg_key_dynamic {
    1       "";
    default $sg_ip_key;
}

# Solo POST a wp-login cuenta (ver el formulario no)
map "$request_method:$sg_endpoint" $sg_key_login {
    "POST:login" $sg_ip_key;
    default      "";
}

map $sg_endpoint $sg_key_xmlrpc {
    xmlrpc  $sg_ip_key;
    default "";
}

map $sg_endpoint $sg_key_ajax {
    ajax    $sg_ip_key;
    default "";
}

map "$sg_endpoint:$sg_arg_class" $sg_key_rest {
    "~^rest:"  $sg_ip_key;
    "~:rest$"  $sg_ip_key;
    default    "";
}

map $sg_arg_class $sg_key_wcajax {
    wcajax  $sg_ip_key;
    default "";
}

# Clientes HTTP "de script" sin disfrazar. NO incluye axios/node-fetch/okhttp/Guzzle
# (integraciones legítimas: tu panel Woo, apps móviles, webhooks).
map $http_user_agent $sg_ua_suspicious {
    default 0;
    ""      1;
    "~*^(?:curl/|python-requests/|go-http-client/|libwww-perl|java/|wget/|masscan|zgrab|fasthttp)" 1;
}

map "$sg_ua_suspicious:$sg_is_static" $sg_key_suspicious {
    "1:0"   $sg_ip_key;
    default "";
}

# ---------------------------------------------------------------------------
# Reglas Nginx NUEVAS (baratas, antes de cualquier location y de PHP).
# AUDIT ($sg_nginx_enforce=0): solo se registran en el log JSON ("nb").
# ENFORCE ($sg_nginx_enforce=1): 403.
# ---------------------------------------------------------------------------

# Métodos HTTP válidos para WordPress/WooCommerce/REST (PUT/PATCH/DELETE: API REST de Woo)
map $request_method $sg_block_method {
    default "bad_method";
    "~^(?:GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$" "";
}

map $uri $sg_block_path {
    default "";
    # Let's Encrypt: nunca
    "~^/\.well-known/acme-challenge/"                                       "";
    # Extensiones que un WordPress nunca sirve (incluye uploads/wc-logs/*.log)
    "~*\.(?:sql|sqlite3?|bak|backup|old|orig|save|swp|swo|log|ini|conf|cfg|env|ya?ml|pem|key|p12|pfx|kdbx)$" "sensitive_ext";
    # PHPUnit RCE (en cualquier profundidad: plugins que empaquetan vendor/)
    "~*/vendor/phpunit/|eval-stdin\.php"                                    "phpunit";
    # Rutas de exploits no-WordPress, ancladas a la raíz.
    # ⚠ Si algún SUBSITIO multisite se llama igual que una de estas rutas, quítala de aquí.
    "~*^/(?:cgi-bin|phpmyadmin|pma|myadmin|mysqladmin|sqladmin|dbadmin|adminer|_ignition|telescope|actuator|solr|owa|ecp|autodiscover|boaform|hnap1|jenkins|jmx-console|invoker|axis2|druid|geoserver|hudson|webui|gponform|server-status|server-info)(?:/|$)" "exploit_path";
    "~*^/remote/login"                                                      "exploit_path";
    # Instalador de WordPress (ya instalado)
    "~*^/(?:[_0-9a-zA-Z-]+/)?wp-admin/(?:install|setup-config)\.php$"      "wp_install";
    # PHP directo en wp-includes (hardening oficial de WordPress; wp-tinymce.php NO se bloquea)
    "~*^/wp-includes/[^/]+\.php$"                                           "wp_includes_php";
    "~*^/wp-includes/js/tinymce/langs/.+\.php$"                             "wp_includes_php";
    "~*^/wp-includes/theme-compat/"                                         "wp_includes_php";
    # Ejecutables dentro de uploads (tu vhost ya deniega .php; esto cubre .phtml/.phar/...)
    "~*^/(?:[_0-9a-zA-Z-]+/)?wp-content/uploads/.*\.(?:php\d?|phtml|phar|pht|phps|cgi|pl|py|sh|asp|aspx|jsp)$" "uploads_exec";
    # Fingerprinting de versión
    "~*^/(?:readme\.html|license\.txt|wp-config-sample\.php)$"             "wp_fingerprint";
}

# Payloads inequívocos en la query CRUDA ($args no está decodificado)
map $args $sg_block_args {
    default "";
    "~*(?:\.\./|\.\.%2f|%2e%2e(?:%2f|/|%5c)|%252e%252e)"                   "traversal_args";
    "~*(?:/etc/passwd|%2fetc%2fpasswd|/proc/self/environ|php://|php%3a%2f%2f|phar://|expect://|\$\{jndi|%24%7bjndi)" "rce_args";
}

map "$sg_nginx_enforce:$sg_block_method$sg_block_path$sg_block_args" $sg_nginx_deny {
    default 0;
    "~^1:.+" 1;
}

# ---------------------------------------------------------------------------
# Log JSON de SmartGuard (qué se registra y cómo, sin datos sensibles)
# ---------------------------------------------------------------------------

# Ruta SIN query string (la query puede tener tokens de reset, emails…)
map $request_uri $sg_log_path {
    default "";
    "~^(?<sg_lp>[^?]*)" $sg_lp;
}

# Referer SIN query string
map $http_referer $sg_log_ref {
    default "";
    "~^(?<sg_rp>[^?]*)" $sg_rp;
}

map $is_args $sg_has_query {
    "?"     "true";
    default "false";
}

# Qué líneas se escriben (a nivel server). No se registra el tráfico normal 2xx/3xx:
#   - cualquier regla Nginx nueva que coincidió (nb), incluso en AUDIT
#   - 4xx (estáticos y dinámicos) y 5xx dinámicos
#   - todo lo de wp-login (para detectar logins fallidos: POST 200 = fallo, 302 = éxito)
#   - decisiones de SmartGuard distintas de ALLOW (OBSERVE, WOULD_*, RATE_LIMIT, BLOCK, errores)
map "$sg_block_method$sg_block_path$sg_block_args|$sg_is_static|$status|$sg_endpoint|$sg_decision" $sg_log_enabled {
    default 0;
    "~^[a-z_]+\|"                          1;
    "~^\|[01]\|4"                          1;
    "~^\|0\|5"                             1;
    "~^\|0\|\d+\|login\|"                  1;
    "~^\|0\|\d+\|[a-z]*\|(?!ALLOW$)[A-Z_]+$" 1;
}

# Para la location de estáticos (que antes tenía access_log off): solo 4xx
map $status $sg_log_static_err {
    "~^4"   1;
    default 0;
}
