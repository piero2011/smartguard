# =============================================================================
# /etc/nginx/smartguard/rate-limits.conf — zonas (contexto http). EDITABLE (update.sh lo conserva).
# =============================================================================
# Filosofía (punto 9, 11, 24, 25): estos límites son ANTI-FLOOD por endpoint, con valores ALTOS
# para no afectar a empresas con NAT, HTTP/2 multiplexado ni móviles. La inteligencia
# (scanners, exploits, credential stuffing) está en SmartGuard, no aquí.
#
# Clave = IP real del visitante (tras realip). Clave vacía = no cuenta (estáticos, IPs de confianza).
# Memoria: ~16 000 estados por MB (IPv4). 10m ≈ 160 000 IPs.
#
# Valores de burst por zona: /etc/nginx/smartguard/server.conf
# =============================================================================

# Todo lo NO estático (páginas, PHP, REST, AJAX). 30 r/s sostenido por IP + ráfaga 300.
limit_req_zone $sg_key_dynamic    zone=sg_dynamic:20m    rate=30r/s;

# POST /wp-login.php: estricto. Los clientes WooCommerce usan /my-account/, no wp-login.
limit_req_zone $sg_key_login      zone=sg_login:10m      rate=10r/m;

# xmlrpc.php (solo relevante si lo habilitas; hoy está bloqueado con 444 en el vhost)
limit_req_zone $sg_key_xmlrpc     zone=sg_xmlrpc:5m      rate=2r/m;

# admin-ajax.php: heartbeat, Elementor, WooCommerce admin → alto
limit_req_zone $sg_key_ajax       zone=sg_ajax:10m       rate=20r/s;

# ?wc-ajax= (carrito, fragments, checkout) → alto
limit_req_zone $sg_key_wcajax     zone=sg_wcajax:10m     rate=20r/s;

# /wp-json/ y ?rest_route= (Store API de WooCommerce, Gutenberg, integraciones)
limit_req_zone $sg_key_rest       zone=sg_rest:10m       rate=15r/s;

# UA de script sin disfrazar (curl/python-requests/...) o vacío, solo dinámico
limit_req_zone $sg_key_suspicious zone=sg_suspicious:10m rate=5r/s;

# Conexiones/peticiones simultáneas por IP (en HTTP/2 cada stream cuenta)
limit_conn_zone $sg_ip_key        zone=sg_conn:20m;
limit_conn_zone $sg_key_dynamic   zone=sg_conn_dynamic:20m;
