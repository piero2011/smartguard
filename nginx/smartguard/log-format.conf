# =============================================================================
# /etc/nginx/smartguard/log-format.conf — contexto http
# =============================================================================
# Variables rellenadas por auth_request (declaradas a nivel http para que existan siempre;
# solo tienen valor en locations con auth_request, es decir, las que van a PHP-FPM).
auth_request_set $sg_decision $upstream_http_x_smartguard_decision;
auth_request_set $sg_score    $upstream_http_x_smartguard_score;

# Log JSON para el analizador de SmartGuard (punto 18). SIN datos sensibles:
#   - ruta sin query string ("q" solo indica si había query)
#   - referer sin query string
#   - sin cookies, sin Authorization, sin cuerpo, sin datos de checkout
# ip  = IP real del visitante ($remote_addr tras realip)
# tcp = IP TCP real ($realip_remote_addr); cf = 1 si esa IP TCP es de Cloudflare
# php = upstream PHP-FPM ("" si la petición NO llegó a PHP)
# sg  = decisión de SmartGuard (solo si pasó por auth_request)
# nb  = regla Nginx nueva que coincidió (bloqueada en ENFORCE, solo registrada en AUDIT)
# lr/lc = estado de limit_req/limit_conn (PASSED, REJECTED, REJECTED_DRY_RUN...)
log_format smartguard_json escape=json
    '{"ts":"$time_iso8601","rid":"$request_id","ray":"$http_cf_ray",'
    '"ip":"$remote_addr","tcp":"$realip_remote_addr","cf":$sg_tcp_from_cloudflare,'
    '"m":"$request_method","h":"$host","p":"$sg_log_path","q":$sg_has_query,'
    '"st":$status,"rt":$request_time,"b":$body_bytes_sent,'
    '"ua":"$http_user_agent","ref":"$sg_log_ref","cc":"$http_cf_ipcountry",'
    '"php":"$upstream_addr","sg":"$sg_decision","sc":"$sg_score",'
    '"nb":"$sg_block_method$sg_block_path$sg_block_args",'
    '"lr":"$limit_req_status","lc":"$limit_conn_status","v":"$server_protocol"}';
