# =============================================================================
# /etc/nginx/smartguard/allowlist.conf — GENERADO por `smartguard nginx-sync`
# a partir de ADMIN_ALLOWLIST, SERVICE_ALLOWLIST y TRUSTED_NETWORKS del .env.
# =============================================================================
# geo usa $remote_addr (ya resuelto por realip → IP real del visitante).
# 1 = exento de los limit_req/limit_conn de SmartGuard (NO exento de las reglas de rutas prohibidas).
geo $sg_trusted {
    default         0;
    127.0.0.0/8     1;
    ::1/128         1;
}
