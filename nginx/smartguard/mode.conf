# =============================================================================
# /etc/nginx/smartguard/mode.conf — GENERADO por `smartguard audit on|off` y `smartguard killswitch`
# No editar a mano (se sobrescribe).
# =============================================================================

# 0 = AUDIT: las reglas Nginx NUEVAS de SmartGuard solo se registran ("nb" en el log JSON)
# 1 = ENFORCE: se bloquean con 403
map $host $sg_nginx_enforce {
    default 0;
}

# 1 = kill switch: auth_request responde 204 sin consultar a SmartGuard (desactivación de emergencia)
map $host $sg_killswitch {
    default 0;
}
