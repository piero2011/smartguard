# =============================================================================
# /etc/nginx/smartguard/server.conf — contexto SERVER (include dentro de cada server {} protegido)
# =============================================================================
# Colocar al PRINCIPIO del server{}, antes de las location y antes de los rewrites multisite:
#
#     include /etc/nginx/smartguard/server.conf;
#     include /etc/nginx/smartguard/auth.conf;
#
# Todo lo de aquí se aplica a TODAS las locations del server (herencia de nivel server),
# por eso una petición directa a *.php ya no puede saltarse la protección.
# =============================================================================

# 1) Reglas Nginx nuevas (métodos, rutas de exploit, archivos sensibles, payloads).
#    Se evalúan en la fase rewrite del server: ANTES de elegir location y ANTES de PHP.
#    AUDIT → nunca bloquea (solo "nb" en el log). ENFORCE → 403.
if ($sg_nginx_deny) {
    return 403;
}

# 2) Límites por endpoint (valores de zona en rate-limits.conf)
limit_req_status  429;
limit_conn_status 429;
include /etc/nginx/smartguard/limits-mode.conf;

limit_req zone=sg_dynamic    burst=300 nodelay;
limit_req zone=sg_login      burst=20  nodelay;
limit_req zone=sg_xmlrpc     burst=5   nodelay;
limit_req zone=sg_ajax       burst=150 nodelay;
limit_req zone=sg_wcajax     burst=150 nodelay;
limit_req zone=sg_rest       burst=150 nodelay;
limit_req zone=sg_suspicious burst=50  nodelay;

# Peticiones simultáneas por IP. Valores altos a propósito (NAT, HTTP/2, HTTP/3, móviles).
limit_conn sg_conn         128;
limit_conn sg_conn_dynamic 48;

# 3) Log JSON para el analizador (solo líneas relevantes para seguridad; ver $sg_log_enabled)
access_log /var/log/nginx/smartguard/access.json smartguard_json buffer=64k flush=2s if=$sg_log_enabled;
