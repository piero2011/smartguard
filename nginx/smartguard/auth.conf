# =============================================================================
# /etc/nginx/smartguard/auth.conf — contexto SERVER. Define las locations INTERNAS de auth_request.
# =============================================================================
# Solo las locations que hacen fastcgi_pass incluyen auth-php.conf → SOLO el tráfico que iba a
# PHP-FPM consulta a SmartGuard. Imágenes/CSS/JS/fuentes NUNCA generan subpeticiones.
#
# FAIL-OPEN (punto 34): si SmartGuard está caído, no responde en 300 ms o devuelve 5xx,
# la subpetición termina en @smartguard_failopen (204) y la petición sigue a PHP normalmente.
# Las reglas puramente Nginx (server.conf y tu vhost) siguen activas en cualquier caso.
#
# auth_request solo entiende 2xx (permitir), 401 y 403. SmartGuard responde 429 para RATE_LIMIT
# (según la especificación de la API); aquí se traduce a 403 para no provocar un 500.
# Motivo de NO usar error_page 403/429 en la location PHP: tu vhost tiene
# fastcgi_intercept_errors on, y eso reemplazaría también los 401/403 LEGÍTIMOS de WordPress
# (REST API, nonces de Elementor/WooCommerce). El 429 real lo dan los limit_req de server.conf.
# =============================================================================

location = /_smartguard/decision {
    internal;

    # Kill switch de emergencia (smartguard killswitch on): permitir sin consultar
    if ($sg_killswitch) {
        return 204;
    }

    proxy_pass http://smartguard_backend/internal/decision;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # No se reenvía NADA del cliente salvo lo explícito: sin cookies, sin Authorization, sin cuerpo.
    proxy_pass_request_body    off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Host "smartguard.internal";

    # Secreto compartido (archivo 0600 root, generado por install.sh)
    include /etc/nginx/smartguard/secret.conf;

    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-TCP-IP          $realip_remote_addr;
    proxy_set_header X-Original-URI    $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-User-Agent      $http_user_agent;
    proxy_set_header X-Host            $host;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header X-Accept-Language $http_accept_language;
    proxy_set_header X-Country         $http_cf_ipcountry;

    # Tiempos agresivos: SmartGuard responde en < 1 ms; si no, fail-open.
    proxy_connect_timeout 100ms;
    proxy_send_timeout    250ms;
    proxy_read_timeout    300ms;
    proxy_next_upstream   off;
    proxy_buffering       off;

    proxy_intercept_errors on;
    error_page 429                 = @smartguard_limited;
    error_page 500 502 503 504     = @smartguard_failopen;

    access_log    off;
    log_not_found off;
}

location @smartguard_failopen {
    internal;
    access_log off;
    return 204;
}

location @smartguard_limited {
    internal;
    access_log off;
    return 403;
}
