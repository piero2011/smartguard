# =============================================================================
# SmartGuard — contexto HTTP (global, todos los vhosts)
# =============================================================================
# install.sh lo coloca donde nginx.conf lo cargue dentro de http {}:
#   /etc/nginx/conf.d/smartguard.conf            si nginx.conf incluye conf.d/*.conf
#   /etc/nginx/sites-enabled/00-smartguard.conf  en CloudPanel (solo incluye sites-enabled/*.conf)
# Verificar:  sudo nginx -T 2>/dev/null | grep -n 'smartguard.conf'
#
# Este archivo solo DEFINE variables, zonas, upstream y formato de log.
# No cambia el comportamiento de ningún sitio hasta que el vhost incluya
# /etc/nginx/smartguard/server.conf y auth*.conf.
#
# EXCEPCIÓN: cloudflare-realip.conf SÍ cambia $remote_addr globalmente (es lo correcto).
# install.sh solo lo activa si NO existe ya una configuración real_ip (evita "duplicate").
# =============================================================================

# IP real del visitante detrás de Cloudflare (generado por update-cloudflare-ips.sh)
include /etc/nginx/smartguard/cloudflare-realip.conf;

# $sg_tcp_from_cloudflare (1 si la conexión TCP viene de Cloudflare)
include /etc/nginx/smartguard/cloudflare-geo.conf;

# Modo AUDIT/ENFORCE de las reglas Nginx nuevas + kill switch de auth_request
include /etc/nginx/smartguard/mode.conf;

# IPs de confianza (admin/servicios): exentas de los límites de SmartGuard
include /etc/nginx/smartguard/allowlist.conf;

include /etc/nginx/smartguard/maps.conf;
include /etc/nginx/smartguard/rate-limits.conf;
include /etc/nginx/smartguard/log-format.conf;
include /etc/nginx/smartguard/upstream.conf;
